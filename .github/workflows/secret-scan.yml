# Server-side secret scanning -- filet final apres pre-commit local.
# DETTE-011 (T-VAULT-PLAINTEXT-FIX-2026-05-18 follow-up).
# gitleaks scanne TOUT l'historique du push (fetch-depth: 0) + le diff PR.

name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No GITLEAKS_LICENSE -- this repo is for a personal organization,
          # the action runs in OSS mode (free for individuals).
