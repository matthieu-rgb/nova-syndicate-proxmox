#cloud-config
hostname: backup01
manage_etc_hosts: true
fqdn: backup01.nova-syndicate.local

users:
  - name: ansible
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - # Remplacer par la cle SSH ansible

package_update: true
package_upgrade: false

packages:
  - qemu-guest-agent
  - python3
  - sudo
  # BorgBackup sera installe par Ansible ; rclone sera installe manuellement
  - fuse3

runcmd:
  - systemctl enable --now qemu-guest-agent
