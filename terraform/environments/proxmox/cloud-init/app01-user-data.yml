#cloud-config
hostname: app01
manage_etc_hosts: true
fqdn: app01.nova-syndicate.local

users:
  - name: ansible
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - # Remplacer par la cle SSH ansible

package_update: true
package_upgrade: false

packages:
  - qemu-guest-agent
  - python3
  - sudo
  # Wazuh Manager necessite plus de memoire virtuelle
  - sysfsutils

runcmd:
  - systemctl enable --now qemu-guest-agent
  # Wazuh indexer exige vm.max_map_count >= 262144
  - sysctl -w vm.max_map_count=262144
  - echo "vm.max_map_count=262144" >> /etc/sysctl.d/99-wazuh.conf
