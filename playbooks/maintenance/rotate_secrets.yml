---
- name: "Maintenance -- Rotation des secrets (rappel)"
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Rappel de rotation
      ansible.builtin.debug:
        msg: |
          ========================================
          ROTATION DES SECRETS — A FAIRE MANUELLEMENT
          ========================================
          1. Generer de nouveaux mots de passe
          2. Mettre a jour inventory/group_vars/all/vault.yml
          3. Re-chiffrer : ansible-vault encrypt inventory/group_vars/all/vault.yml
          4. Relancer les playbooks concernes :
             - ansible-playbook playbooks/deploy_dc.yml --tags dc:samba
             - ansible-playbook playbooks/deploy_database.yml --tags db:secure
          5. Tester la connectivite des services
          ========================================
          En Phase II : HashiCorp Vault gere la rotation automatiquement
