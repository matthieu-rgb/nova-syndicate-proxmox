---
# =============================================================
# Nova Syndicate — Deploiement complet Phase II
# Ordre obligatoire : common -> hardening -> role metier
# Usage : ansible-playbook site.yml
# Dry run : ansible-playbook site.yml --check --diff
# =============================================================

- name: "ETAPE 1 -- Base commune sur toutes les VMs"
  hosts: nova_all
  roles:
    - common
  tags: [role:common]

- name: "ETAPE 2 -- Durcissement de toutes les VMs"
  hosts: nova_all
  roles:
    - hardening
  tags: [role:hardening]

- name: "ETAPE 3 -- Controleur de Domaine (DC01)"
  hosts: domain_controllers
  roles:
    - dc
  tags: [role:dc]

- name: "ETAPE 4 -- Serveur de Fichiers (FS01)"
  hosts: fileservers
  roles:
    - fileserver
  tags: [role:fileserver]

- name: "ETAPE 5 -- Base de Donnees (DB01)"
  hosts: databases
  roles:
    - database
  tags: [role:database]

- name: "ETAPE 6 -- Bastion SSH (BASTION01)"
  hosts: bastions
  roles:
    - bastion
  tags: [role:bastion]

- name: "ETAPE 7 -- VPN WireGuard + IPsec"
  hosts: domain_controllers
  roles:
    - vpn
  tags: [role:vpn]
