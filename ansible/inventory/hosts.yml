---
# Inventaire Nova Syndicate
# Toutes les connexions SSH passent par BASTION01
# ansible_ssh_common_args configure le jump host

all:
  vars:
    ansible_user: debian
    ansible_ssh_private_key_file: ~/.ssh/nova_syndicate_ed25519
    ansible_python_interpreter: /usr/bin/python3

  children:

    # ----------------------------------------------------------
    # BASTION - noeud de controle SSH (pas de jump host)
    # ----------------------------------------------------------
    bastion:
      hosts:
        BASTION01:
          ansible_host: 192.168.15.10
          ansible_ssh_common_args: ""   # connexion directe

    # ----------------------------------------------------------
    # VLAN 20 - Serveurs internes (via BASTION01)
    # ----------------------------------------------------------
    servers:
      hosts:
        DC01:
          ansible_host: 192.168.20.10
        FS01:
          ansible_host: 192.168.20.11
        DB01:
          ansible_host: 192.168.20.12
        APP01:
          ansible_host: 192.168.20.13

    # ----------------------------------------------------------
    # DMZ - Serveurs exposes (via BASTION01)
    # ----------------------------------------------------------
    dmz:
      hosts:
        WEB01:
          ansible_host: 172.16.1.10
        MAIL01:
          ansible_host: 172.16.1.11

    # ----------------------------------------------------------
    # VLAN 50 - Backup
    # ----------------------------------------------------------
    backup:
      hosts:
        BACKUP01:
          ansible_host: 192.168.50.10

    # ----------------------------------------------------------
    # Groupe global avec jump host BASTION01
    # ----------------------------------------------------------
    jumphost_required:
      vars:
        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=no
          -o ProxyJump=debian@192.168.15.10
      children:
        servers:
        dmz:
        backup:
