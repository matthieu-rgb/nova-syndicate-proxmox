---
- name: Installer gnupg et curl
  ansible.builtin.apt:
    name:
      - gnupg
      - curl
    state: present
    update_cache: true

- name: Ajouter la cle GPG Wazuh
  ansible.builtin.shell: |
    curl -s https://packages.wazuh.com/key/GPG-KEY-WAZUH | gpg --dearmor -o /usr/share/keyrings/wazuh.gpg
  args:
    creates: /usr/share/keyrings/wazuh.gpg




- name: Ajouter le depot Wazuh
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/wazuh.gpg] https://packages.wazuh.com/4.x/apt/ stable main"
    state: present
    filename: wazuh


- name: Installer wazuh-agent
  ansible.builtin.apt:
    name: wazuh-agent=4.11.2-1
    state: present
    update_cache: true
  environment:
    WAZUH_MANAGER: "{{ wazuh_manager_ip }}"

- name: Activer et demarrer wazuh-agent
  ansible.builtin.service:
    name: wazuh-agent
    state: started
    enabled: true

- name: Configurer le manager dans ossec.conf
  ansible.builtin.replace:
    path: /var/ossec/etc/ossec.conf
    regexp: '<address>.*</address>'
    replace: '<address>{{ wazuh_manager_ip }}</address>'
  notify: restart wazuh-agent

- name: Enregistrer l agent aupres du manager
  ansible.builtin.shell: |
    /var/ossec/bin/agent-auth -m {{ wazuh_manager_ip }} -p 1515
  args:
    creates: /var/ossec/etc/client.keys
  notify: restart wazuh-agent

- name: Deployer les regles NIS2 custom
  ansible.builtin.copy:
    dest: /var/ossec/etc/rules/nova_nis2_rules.xml
    content: |
      <group name="nova,nis2,">
        <rule id="100001" level="10">
          <if_group>sshd</if_group>
          <match>Failed password</match>
          <description>NIS2: Tentative authentification SSH echouee</description>
          <group>authentication_failure,nis2</group>
        </rule>
        <rule id="100002" level="8">
          <if_group>sudo</if_group>
          <match>COMMAND</match>
          <description>NIS2: Execution commande sudo - privilege eleve</description>
          <group>privilege_escalation,nis2</group>
        </rule>
        <rule id="100003" level="12">
          <if_group>syscheck</if_group>
          <match>/etc/passwd|/etc/shadow|/etc/sudoers</match>
          <description>NIS2: Modification fichier systeme critique</description>
          <group>file_integrity,nis2</group>
        </rule>
      </group>
  when: inventory_hostname == groups["app"][0]
  notify: reload wazuh-manager
