---
# --- OUs ---
- name: Creer les OUs dans Samba AD
  ansible.builtin.command:
    cmd: >
      samba-tool ou create "{{ item }}"
      -U Administrator --password="{{ vault_samba_admin_password }}"
  loop: "{{ nova_ad_ous }}"
  register: ou_result
  changed_when: "'Created' in (ou_result.stdout | default(''))"
  failed_when: >
    ou_result.rc != 0
    and 'already' not in (ou_result.stdout | default('') ~ ou_result.stderr | default(''))
  no_log: true

# --- Groupes ---
- name: Creer les groupes AD
  ansible.builtin.command:
    cmd: >
      samba-tool group add "{{ item.name }}"
      --description="{{ item.description }}"
      -U Administrator --password="{{ vault_samba_admin_password }}"
  loop: "{{ nova_ad_groups }}"
  register: group_result
  changed_when: "'Added' in (group_result.stdout | default(''))"
  failed_when: >
    group_result.rc != 0
    and 'already' not in (group_result.stdout | default('') ~ group_result.stderr | default(''))
  no_log: true

# --- Comptes tiering ---
- name: Creer les comptes admin tiering
  ansible.builtin.command:
    cmd: >
      samba-tool user create "{{ item.name }}"
      "{{ vault_samba_admin_password }}"
      --description="{{ item.description }}"
      --use-username-as-cn
      -U Administrator --password="{{ vault_samba_admin_password }}"
  loop: "{{ nova_ad_tiering_accounts }}"
  register: tier_user_result
  changed_when: "'User' in (tier_user_result.stdout | default(''))"
  failed_when: >
    tier_user_result.rc != 0
    and 'already' not in (tier_user_result.stdout | default('') ~ tier_user_result.stderr | default(''))
  no_log: true

- name: Ajouter les comptes tiering a leurs groupes
  ansible.builtin.command:
    cmd: >
      samba-tool group addmembers "{{ item.1 }}" "{{ item.0.name }}"
      -U Administrator --password="{{ vault_samba_admin_password }}"
  loop: "{{ nova_ad_tiering_accounts | subelements('groups') }}"
  register: tier_group_result
  changed_when: "'Added' in (tier_group_result.stdout | default(''))"
  failed_when: >
    tier_group_result.rc != 0
    and 'already' not in (tier_group_result.stdout | default('') ~ tier_group_result.stderr | default(''))
  no_log: true
