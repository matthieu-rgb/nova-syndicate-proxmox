---
- name: Installer isc-dhcp-server
  ansible.builtin.apt:
    name: isc-dhcp-server
    state: present

- name: Deployer la configuration DHCP
  ansible.builtin.template:
    src: dhcpd.conf.j2
    dest: /etc/dhcp/dhcpd.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart dhcpd

- name: Configurer le service isc-dhcp-server (activation conditionnelle)
  ansible.builtin.systemd:
    name: isc-dhcp-server
    enabled: "{{ nova_dhcp_enabled | default(false) }}"
    state: "{{ 'started' if nova_dhcp_enabled | default(false) else 'stopped' }}"
