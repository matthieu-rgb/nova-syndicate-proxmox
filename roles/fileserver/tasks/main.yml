---
- name: Installer les paquets Samba/Winbind
  ansible.builtin.apt:
    name: "{{ fs_packages }}"
    state: present
  tags: [role:fileserver, fs:packages]

- name: Deployer krb5.conf (jointure au domaine)
  ansible.builtin.template:
    src: krb5.conf.j2
    dest: /etc/krb5.conf
    owner: root
    group: root
    mode: "0644"
  tags: [role:fileserver, fs:kerberos]

- name: Verifier si la machine est jointe au domaine
  ansible.builtin.command:
    cmd: net ads testjoin
  register: domain_join_check
  changed_when: false
  failed_when: false
  tags: [role:fileserver, fs:domain]

- name: Joindre le domaine Samba AD
  ansible.builtin.command:
    cmd: >
      net ads join -U Administrator%{{ vault_samba_admin_password }}
  when: domain_join_check.rc != 0
  no_log: true
  notify: restart smbd
  failed_when: false
  tags: [role:fileserver, fs:domain]

- name: Deployer smb.conf fileserver
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart smbd
  failed_when: false
  tags: [role:fileserver, fs:config]

- name: Creer les repertoires de partage
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "0770"
  loop: "{{ nova_shares }}"
  tags: [role:fileserver, fs:shares]

- name: Activer et demarrer les services Samba
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - smbd
    - nmbd
    - winbind
  tags: [role:fileserver, fs:services]

# --- Backup rsync vers BACKUP01 ---
- name: Deployer le script de backup des partages
  ansible.builtin.template:
    src: fs-backup.sh.j2
    dest: /usr/local/bin/fs-backup.sh
    owner: root
    group: root
    mode: "0700"
  tags: [role:fileserver, fs:backup]

- name: Planifier le backup rsync quotidien
  ansible.builtin.cron:
    name: "FS01 rsync vers BACKUP01"
    minute: "{{ fs_backup_schedule.split(' ')[0] }}"
    hour: "{{ fs_backup_schedule.split(' ')[1] }}"
    day: "{{ fs_backup_schedule.split(' ')[2] }}"
    month: "{{ fs_backup_schedule.split(' ')[3] }}"
    weekday: "{{ fs_backup_schedule.split(' ')[4] }}"
    job: "/usr/local/bin/fs-backup.sh"
    user: root
  tags: [role:fileserver, fs:backup]
