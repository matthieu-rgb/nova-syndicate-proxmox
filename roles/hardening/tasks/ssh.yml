---
- name: Deployer la configuration SSH durcie
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
    validate: "sshd -t -f %s"
  notify: restart sshd

- name: Activer et demarrer sshd
  ansible.builtin.systemd:
    name: sshd
    enabled: true
    state: started
