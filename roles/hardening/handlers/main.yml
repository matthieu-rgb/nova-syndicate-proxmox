---
- name: restart sshd
  ansible.builtin.systemd:
    name: sshd
    state: restarted

- name: reload nftables
  ansible.builtin.systemd:
    name: nftables
    state: reloaded

- name: restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted

- name: restart auditd
  ansible.builtin.service:
    name: auditd
    state: restarted
    use: service
