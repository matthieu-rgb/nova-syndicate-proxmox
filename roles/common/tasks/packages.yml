---
- name: Supprimer les verrous apt si presents
  ansible.builtin.shell: |
    systemctl stop unattended-upgrades apt-daily.timer apt-daily-upgrade.timer 2>/dev/null; true
    rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock 2>/dev/null; true
  changed_when: false

- name: Mettre a jour le cache APT
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Installer les paquets de base
  ansible.builtin.apt:
    name:
      - curl
      - vim
      - rsync
      - net-tools
      - ca-certificates
      - git
      - python3
      - python3-pip
      - sudo
      - dnsutils
      - gnupg
      - apt-transport-https
    state: present

- name: Installer les paquets supplementaires du role
  ansible.builtin.apt:
    name: "{{ common_extra_packages }}"
    state: present
  when: common_extra_packages | length > 0
