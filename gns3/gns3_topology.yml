---
# Nova Syndicate - Deploiement topologie GNS3 via API REST
# Usage : ansible-playbook gns3_topology.yml
# Prerequis : templates GNS3 installes (OPNsense, Debian, c2691, IOU L2)

- name: Nova Syndicate - Topologie GNS3
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    gns3_host: "192.168.158.179"
    gns3_port: "80"
    gns3_url: "http://{{ gns3_host }}:{{ gns3_port }}/v2"
    project_name: "Nova-Syndicate"

    # UUIDs des templates (recuperes via API le 09/04/2026)
    tpl_opnsense:    "753886e0-5c68-4bcf-88a3-272bb943e5c5"   # a remplacer apres reinstallation
    tpl_debian:      "eeca083d-3069-460f-b3b6-aef20b62456f"
    tpl_c2691:       "26b00ad3-dc66-4a6b-8492-c57ba98430e8"
    tpl_iou_l2:      "5e60c842-4e99-4c0d-b484-91a5669eb20e"
    tpl_vpcs:        "19021f99-e36f-394d-b4a1-8aaa902ab9cc"
    tpl_switch:      "1966b864-93e7-32d5-965f-001384eec461"
    tpl_cloud:       "39e257dc-8412-3174-b6b3-0ee3ed6a43e9"
    tpl_webterm:     "cdbc142b-b183-4f36-9b6b-58f8f6d29e22"

  tasks:

    # ============================================================
    # ETAPE 0 - Verifier et preparer OPNsense automatiquement
    # ============================================================

    - name: Verifier les templates existants
      uri:
        url: "{{ gns3_url }}/templates"
        method: GET
        return_content: true
      register: templates_list

    - name: Creer le template OPNsense si absent
      uri:
        url: "{{ gns3_url }}/templates"
        method: POST
        body_format: json
        body:
          name: "OPNsense 25.1"
          template_type: "qemu"
          compute_id: "local"
          platform: "x86_64"
          hda_disk_image: "OPNsense-25.1-nano-amd64.img"
          ram: 1024
          adapters: 4
          adapter_type: "virtio-net-pci"
          hda_disk_interface: "virtio"
          boot_priority: "c"
          console_type: "telnet"
          category: "firewall"
          symbol: ":/symbols/firewall.svg"
        status_code: [200, 201]
        return_content: true
      register: new_template
      when: "'OPNsense 25.1' not in (templates_list.json | map(attribute='name') | list)"

    - name: Mettre a jour tpl_opnsense si nouveau template cree
      set_fact:
        tpl_opnsense: "{{ new_template.json.template_id }}"
      when: new_template is not skipped

    - name: Recuperer template_id OPNsense existant
      set_fact:
        tpl_opnsense: "{{ (templates_list.json | selectattr('name', 'equalto', 'OPNsense 25.1') | list | first).template_id }}"
      when:
        - new_template is skipped
        - "'OPNsense 25.1' in (templates_list.json | map(attribute='name') | list)"

    - name: UUID OPNsense utilise
      debug:
        msg: "OPNsense template_id : {{ tpl_opnsense }}"

    # ============================================================
    # ETAPE 1 - Creer le projet
    # ============================================================

    - name: Creer le projet Nova-Syndicate
      uri:
        url: "{{ gns3_url }}/projects"
        method: POST
        body_format: json
        body:
          name: "{{ project_name }}"
        status_code: [200, 201, 409]
        return_content: true
      register: project_result

    - name: Recuperer project_id (nouveau ou existant)
      set_fact:
        project_id: "{{ project_result.json.project_id }}"
      when: project_result.status in [200, 201]

    - name: Chercher projet existant si 409
      block:
        - uri:
            url: "{{ gns3_url }}/projects"
            method: GET
            return_content: true
          register: all_projects
        - set_fact:
            project_id: "{{ (all_projects.json | selectattr('name', 'equalto', project_name) | list | first).project_id }}"
      when: project_result.status == 409

    - name: Afficher project_id
      debug:
        msg: "Projet : {{ project_name }} | ID : {{ project_id }}"

    # ============================================================
    # ETAPE 2 - Creer tous les noeuds
    # ============================================================

    # Recuperer les noeuds existants
    - name: Lister les noeuds existants dans le projet
      uri:
        url: "{{ gns3_url }}/projects/{{ project_id }}/nodes"
        method: GET
        return_content: true
      register: existing_nodes

    - name: Construire la liste des noms existants
      set_fact:
        existing_node_names: "{{ existing_nodes.json | map(attribute='name') | list }}"

    - name: Creer les noeuds manquants depuis les templates
      uri:
        url: "{{ gns3_url }}/projects/{{ project_id }}/templates/{{ item.body.template_id }}"
        method: POST
        body_format: json
        body:
          name: "{{ item.body.name }}"
          compute_id: "local"
          x: "{{ item.body.x }}"
          y: "{{ item.body.y }}"
        status_code: [200, 201]
        return_content: true
      register: nodes_result
      when: item.body.name not in existing_node_names
      loop:

        # -- Lyon : Internet et routeur --
        - body: { name: "INTERNET-LYO", template_id: "{{ tpl_cloud }}", x: -500, y: -350 }
        - body: { name: "RTR-LYON1", template_id: "{{ tpl_c2691 }}", x: -350, y: -350 }

        # -- Lyon : Firewalls --
        - body: { name: "FW-EXT-LYON1", template_id: "{{ tpl_opnsense }}", x: -150, y: -350 }
        - body: { name: "FW-INT-LYON1", template_id: "{{ tpl_opnsense }}", x: 50, y: -350 }

        # -- Lyon : DMZ --
        - body: { name: "SW-DMZ", template_id: "{{ tpl_switch }}", x: -150, y: -200 }
        - body: { name: "WEB1", template_id: "{{ tpl_debian }}", x: -300, y: -200 }
        - body: { name: "MAIL1", template_id: "{{ tpl_debian }}", x: -50, y: -200 }

        # -- Lyon : Switch coeur --
        - body: { name: "SW-LYON1", template_id: "{{ tpl_iou_l2 }}", x: 50, y: -200 }

        # -- Lyon : Serveurs VLAN 20 --
        - body: { name: "DC1", template_id: "{{ tpl_debian }}", x: -300, y: 0 }
        - body: { name: "FS1", template_id: "{{ tpl_debian }}", x: -150, y: 0 }
        - body: { name: "DB1", template_id: "{{ tpl_debian }}", x: 0, y: 0 }
        - body: { name: "APP1", template_id: "{{ tpl_debian }}", x: 150, y: 0 }

        # -- Lyon : Bastion VLAN 15 --
        - body: { name: "BASTION1", template_id: "{{ tpl_debian }}", x: 300, y: 0 }

        # -- Lyon : Backup VLAN 50 --
        - body: { name: "BACKUP1", template_id: "{{ tpl_debian }}", x: 450, y: 0 }

        # -- Lyon : Users VLAN 30 --
        - body: { name: "SW-USERS", template_id: "{{ tpl_switch }}", x: 50, y: 150 }
        - body: { name: "PC1", template_id: "{{ tpl_vpcs }}", x: -100, y: 150 }
        - body: { name: "PC2", template_id: "{{ tpl_vpcs }}", x: 50, y: 150 }
        - body: { name: "PC3", template_id: "{{ tpl_vpcs }}", x: 200, y: 150 }

        # -- Lyon : webterm --
        - body: { name: "webterm-1", template_id: "{{ tpl_webterm }}", x: 300, y: -200 }

        # -- Agents distants --
        - body: { name: "SW-REMOTE", template_id: "{{ tpl_switch }}", x: -500, y: 0 }
        - body: { name: "AGENT-1", template_id: "{{ tpl_debian }}", x: -600, y: 150 }
        - body: { name: "AGENT-2", template_id: "{{ tpl_debian }}", x: -400, y: 150 }

        # -- Marseille --
        - body: { name: "INTERNET-MRS", template_id: "{{ tpl_cloud }}", x: 700, y: -350 }
        - body: { name: "RTR-MRS1", template_id: "{{ tpl_c2691 }}", x: 700, y: -200 }
        - body: { name: "FW-EXT-MRS1", template_id: "{{ tpl_opnsense }}", x: 700, y: -50 }
        - body: { name: "SW-MRS01", template_id: "{{ tpl_switch }}", x: 700, y: 100 }
        - body: { name: "POSTE-MRS1", template_id: "{{ tpl_debian }}", x: 600, y: 250 }
        - body: { name: "POSTE-MRS2", template_id: "{{ tpl_debian }}", x: 800, y: 250 }

    # Construire le dictionnaire node_ids depuis les noeuds existants
    - name: Recuperer la liste complete des noeuds apres creation
      uri:
        url: "{{ gns3_url }}/projects/{{ project_id }}/nodes"
        method: GET
        return_content: true
      register: all_nodes_after

    - name: Construire le dictionnaire node_ids
      set_fact:
        node_ids: "{{ node_ids | default({}) | combine({ item.name: item.node_id }) }}"
      loop: "{{ all_nodes_after.json }}"

    - name: Afficher les noeuds crees
      debug:
        msg: "Noeud cree : {{ item.key }} -> {{ item.value }}"
      loop: "{{ node_ids | dict2items }}"

    # ============================================================
    # ETAPE 3 - Creer les liens (cables)
    # ============================================================


    # ============================================================
    # ETAPE 2b - Corriger les symboles des noeuds
    # ============================================================

    - name: Corriger les symboles
      uri:
        url: "{{ gns3_url }}/projects/{{ project_id }}/nodes/{{ node_ids[item.name] }}"
        method: PUT
        body_format: json
        body:
          symbol: "{{ item.symbol }}"
        status_code: [200, 201]
      when: item.name in node_ids
      loop:
        - { name: "INTERNET-LYO",  symbol: ":/symbols/cloud.svg" }
        - { name: "INTERNET-MRS",  symbol: ":/symbols/cloud.svg" }
        - { name: "SW-DMZ",        symbol: ":/symbols/ethernet_switch.svg" }
        - { name: "SW-LYON1",      symbol: ":/symbols/ethernet_switch.svg" }
        - { name: "SW-USERS",      symbol: ":/symbols/ethernet_switch.svg" }
        - { name: "SW-REMOTE",     symbol: ":/symbols/ethernet_switch.svg" }
        - { name: "SW-MRS01",      symbol: ":/symbols/ethernet_switch.svg" }

    # Recuperer les liens existants
    - name: Lister les liens existants
      uri:
        url: "{{ gns3_url }}/projects/{{ project_id }}/links"
        method: GET
        return_content: true
      register: existing_links

    # Construire la liste des paires de noeuds deja connectes
    - name: Construire la liste des liens existants
      set_fact:
        existing_link_pairs: >-
          {{ existing_links.json | map(attribute='nodes')
             | map('map', attribute='node_id') | map('sort') | map('join', '-') | list }}

    - name: Creer les liens manquants uniquement
      uri:
        url: "{{ gns3_url }}/projects/{{ project_id }}/links"
        method: POST
        body_format: json
        body:
          nodes:
            - node_id: "{{ node_ids[item.a] }}"
              adapter_number: "{{ item.a_adapter }}"
              port_number: "{{ item.a_port }}"
            - node_id: "{{ node_ids[item.b] }}"
              adapter_number: "{{ item.b_adapter }}"
              port_number: "{{ item.b_port }}"
        status_code: [200, 201]
      when: >-
        item.a in node_ids and item.b in node_ids and
        ([node_ids[item.a], node_ids[item.b]] | sort | join('-'))
        not in existing_link_pairs
      loop:

        # Internet -> RTR-LYON01
        - { a: "INTERNET-LYO",  a_adapter: 0, a_port: 0,  b: "RTR-LYON1",     b_adapter: 0, b_port: 0 }

        # RTR-LYON01 -> FW-EXT-LYON01
        - { a: "RTR-LYON1",    a_adapter: 0, a_port: 1,  b: "FW-EXT-LYON1",  b_adapter: 0, b_port: 0 }

        # FW-EXT -> DMZ (em1)
        - { a: "FW-EXT-LYON1", a_adapter: 1, a_port: 0,  b: "SW-DMZ",         b_adapter: 0, b_port: 0 }

        # FW-EXT -> FW-INT (em2 -> em0)
        - { a: "FW-EXT-LYON1", a_adapter: 2, a_port: 0,  b: "FW-INT-LYON1",  b_adapter: 0, b_port: 0 }

        # FW-EXT -> SW-REMOTE (em3 - agents WireGuard)
        - { a: "FW-EXT-LYON1", a_adapter: 3, a_port: 0,  b: "SW-REMOTE",      b_adapter: 0, b_port: 0 }

        # DMZ : SW-DMZ -> WEB01 et MAIL01
        - { a: "SW-DMZ",        a_adapter: 0, a_port: 1,  b: "WEB1",          b_adapter: 0, b_port: 0 }
        - { a: "SW-DMZ",        a_adapter: 0, a_port: 2,  b: "MAIL1",         b_adapter: 0, b_port: 0 }

        # FW-INT -> SW-LYON01 (trunk em1 -> port 0)
        - { a: "FW-INT-LYON1", a_adapter: 1, a_port: 0,  b: "SW-LYON1",      b_adapter: 0, b_port: 0 }

        # SW-LYON01 -> serveurs VLAN 20
        - { a: "SW-LYON1",     a_adapter: 0, a_port: 1,  b: "DC1",           b_adapter: 0, b_port: 0 }
        - { a: "SW-LYON1",     a_adapter: 0, a_port: 2,  b: "FS1",           b_adapter: 0, b_port: 0 }
        - { a: "SW-LYON1",     a_adapter: 0, a_port: 3,  b: "DB1",           b_adapter: 0, b_port: 0 }
        - { a: "SW-LYON1",     a_adapter: 1, a_port: 1,  b: "APP1",          b_adapter: 0, b_port: 0 }

        # SW-LYON01 -> BASTION01 VLAN 15
        - { a: "SW-LYON1",     a_adapter: 1, a_port: 0,  b: "BASTION1",      b_adapter: 0, b_port: 0 }

        # SW-LYON01 -> BACKUP01 VLAN 50
        - { a: "SW-LYON1",     a_adapter: 2, a_port: 0,  b: "BACKUP1",       b_adapter: 0, b_port: 0 }

        # SW-LYON01 -> SW-USERS (VLAN 30)
        - { a: "SW-LYON1",     a_adapter: 1, a_port: 3,  b: "SW-USERS",       b_adapter: 0, b_port: 0 }

        # SW-LYON01 -> webterm
        - { a: "SW-LYON1",     a_adapter: 1, a_port: 2,  b: "webterm-1",      b_adapter: 0, b_port: 0 }

        # SW-USERS -> postes VLAN 30
        - { a: "SW-USERS",      a_adapter: 0, a_port: 1,  b: "PC1",            b_adapter: 0, b_port: 0 }
        - { a: "SW-USERS",      a_adapter: 0, a_port: 2,  b: "PC2",            b_adapter: 0, b_port: 0 }
        - { a: "SW-USERS",      a_adapter: 0, a_port: 3,  b: "PC3",            b_adapter: 0, b_port: 0 }

        # Agents distants
        - { a: "SW-REMOTE",     a_adapter: 0, a_port: 1,  b: "AGENT-1",       b_adapter: 0, b_port: 0 }
        - { a: "SW-REMOTE",     a_adapter: 0, a_port: 2,  b: "AGENT-2",       b_adapter: 0, b_port: 0 }

        # Marseille
        - { a: "INTERNET-MRS",  a_adapter: 0, a_port: 0,  b: "RTR-MRS1",      b_adapter: 0, b_port: 0 }
        - { a: "RTR-MRS1",     a_adapter: 0, a_port: 1,  b: "FW-EXT-MRS1",   b_adapter: 0, b_port: 0 }
        - { a: "FW-EXT-MRS1",  a_adapter: 1, a_port: 0,  b: "SW-MRS01",       b_adapter: 0, b_port: 0 }
        - { a: "SW-MRS01",      a_adapter: 0, a_port: 1,  b: "POSTE-MRS1",    b_adapter: 0, b_port: 0 }
        - { a: "SW-MRS01",      a_adapter: 0, a_port: 2,  b: "POSTE-MRS2",    b_adapter: 0, b_port: 0 }

    - name: Topologie deployee avec succes
      debug:
        msg: >
          Projet {{ project_name }} deploye sur {{ gns3_url }}.
          Prochaine etape : ouvrir GNS3 client et demarrer les noeuds.
          Puis : terraform apply -> ansible-playbook site.yml
